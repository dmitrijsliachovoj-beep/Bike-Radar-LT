name: Build Bike Radar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -o BikeRadarAndroid_v0.2.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle -Pandroid.useAndroidX=true assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BikeRadar-v0.2-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
