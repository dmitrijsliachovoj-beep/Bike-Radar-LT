name: Build Bike Radar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Bike Radar project
        run: |
          rm -rf project
          mkdir project
          unzip -o Bike-Radar-LT-project.zip -d project
          echo "=== PROJECT CONTENTS ==="
          find project -maxdepth 4 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          echo "Found Gradle wrapper: $GRADLEW"
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bike-Radar-LT-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
